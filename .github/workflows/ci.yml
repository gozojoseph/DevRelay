name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so gitleaks can scan every commit, not just the tip.
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build (API + web)
        run: npm run build

      - name: Migration check (PGlite)
        run: npm run db:check

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node${{ matrix.node }}
          path: coverage/lcov.info

      - name: Security audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Security audit (full tree, high+)
        run: npm audit --audit-level=high

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          # Free for public/personal repos; a license is only required for orgs.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Required by gitleaks-action v2 for pull_request events (it posts
          # inline annotations); push events work without it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
