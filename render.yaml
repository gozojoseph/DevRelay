# Render.com blueprint. Deploys the API (web) and the job worker from the
# same Dockerfile. Secrets marked `sync: false` are entered once in the
# dashboard (they propagate to both services via the env var group).
#
#   Render dashboard -> New -> Blueprint -> point at this repo.
#
# The API's preDeployCommand applies migrations before the new release
# serves traffic; the worker intentionally has none (avoids two processes
# migrating concurrently — the API deploy always precedes the worker).

envVarGroups:
  - name: devrelay-production
    envVars:
      - key: DATABASE_URL
        sync: false
      # Single-origin app: both origins are the final service URL,
      # e.g. https://devrelay-api.onrender.com (fill once the URL is known).
      # NODE_ENV=production refuses to boot unless both are https.
      - key: APP_ORIGIN
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # MUST match the ENCRYPTION_KEY in the local .env (same Neon database):
      # MFA pending/active secrets are AES-256-GCM encrypted with it.
      - key: ENCRYPTION_KEY
        sync: false
      # Production boot REQUIRES a real email rail (server/config.ts gate):
      # EMAIL_MODE=smtp with SMTP_HOST + EMAIL_FROM, OR EMAIL_MODE=mailtrap
      # with MAILTRAP_API_TOKEN + MAILTRAP_FROM_EMAIL. Each rail's vars stay
      # optional while the other is active. Console mode never boots here.
      - key: EMAIL_MODE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Mailtrap Email API rail (EMAIL_MODE=mailtrap):
      #   MAILTRAP_API_TOKEN  -> https://mailtrap.io/settings/api-tokens (Admin access)
      #   MAILTRAP_FROM_EMAIL -> address on your verified sending domain
      # Sent-mail log: https://mailtrap.io/sending/email_logs
      - key: MAILTRAP_API_TOKEN
        sync: false
      - key: MAILTRAP_FROM_EMAIL
        sync: false
      - key: MAILTRAP_FROM_NAME
        value: DevRelay
      # Sandbox needs no verified domain but is dev/preview only (production
      # refuses it at boot); set MAILTRAP_INBOX_ID only while testing.
      - key: MAILTRAP_USE_SANDBOX
        value: "false"
      - key: MAILTRAP_INBOX_ID
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_MODE
        value: live
      - key: AT_CALLBACK_TOKEN
        sync: false
      # Alternative SMS rail (docs/providers.md §AIGH): SMS_PROVIDER=aigh
      # switches the worker to AIGH and needs only AIGH_API_KEY.
      - key: SMS_PROVIDER
        value: africastalking
      - key: AIGH_API_KEY
        sync: false
      - key: AIGH_BASE_URL
        value: https://aigh.dev/api/v1
      # SIM-gateway rail (docs/providers.md §SIM gateway): SMS_PROVIDER=sim-gateway
      # sends through android-sms-gateway on a spare phone. Dev rail / micro-volume;
      # the doc explains why it is not the primary production rail.
      - key: GATEWAY_URL
        sync: false
      - key: GATEWAY_USER
        sync: false
      - key: GATEWAY_PASSWORD
        sync: false
      - key: GATEWAY_SIM_NUMBER
        sync: false
      - key: GATEWAY_WEBHOOK_SECRET
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_CONFIG_ID
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_PRODUCTION_APPROVED
        value: "false"

services:
  # Free web service (spins down after ~15 min idle; see runbook §2.4).
  # NOTE: the worker service below is commented out — Render's free compute
  # does not include background workers, and without provider credentials there
  # are no jobs to process yet. Uncomment + set plan: starter ($7/mo) when you
  # go live with Africa's Talking / WhatsApp sends.
  - type: web
    name: devrelay-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    preDeployCommand: node dist/server/db/migrate.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - fromGroup: devrelay-production

  # - type: worker
  #   name: devrelay-worker
  #   runtime: docker
  #   dockerfilePath: ./Dockerfile
  #   dockerCommand: node dist/server/worker/index.js
  #   plan: starter
  #   envVars:
  #     - key: NODE_ENV
  #       value: production
  #     - key: PORT
  #       value: "8080"
  #     - fromGroup: devrelay-production
